<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A1628"/>
      <stop offset="100%" style="stop-color:#162240"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#E8C96A"/>
      <stop offset="100%" style="stop-color:#D4A843"/>
    </linearGradient>
    <linearGradient id="goldShine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F0D878"/>
      <stop offset="50%" style="stop-color:#D4A843"/>
      <stop offset="100%" style="stop-color:#B8922E"/>
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="256" cy="256" r="256" fill="url(#bg)"/>

  <!-- Subtle outer ring -->
  <circle cx="256" cy="256" r="240" fill="none" stroke="#D4A843" stroke-width="1.5" opacity="0.25"/>

  <!-- Main triangle -->
  <polygon points="256,88 370,320 142,320" fill="url(#goldShine)" opacity="0.95"/>

  <!-- Inner triangle cutout for depth -->
  <polygon points="256,148 330,295 182,295" fill="url(#bg)" opacity="0.85"/>

  <!-- Small inner triangle accent -->
  <polygon points="256,188 300,275 212,275" fill="url(#gold)" opacity="0.3"/>

  <!-- Balance beam / scale line -->
  <line x1="176" y1="330" x2="336" y2="330" stroke="#D4A843" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  <circle cx="176" cy="330" r="4" fill="#D4A843" opacity="0.7"/>
  <circle cx="336" cy="330" r="4" fill="#D4A843" opacity="0.7"/>

  <!-- Text: AE monogram -->
  <text x="256" y="410" text-anchor="middle" font-family="Georgia, 'Playfair Display', serif" font-size="56" font-weight="700" fill="#D4A843" letter-spacing="8">AE</text>

  <!-- Subtle bottom text -->
  <text x="256" y="445" text-anchor="middle" font-family="Arial, 'DM Sans', sans-serif" font-size="16" fill="#D4A843" opacity="0.5" letter-spacing="6">AEQUITAS</text>
</svg>
